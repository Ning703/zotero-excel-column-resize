name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check bootstrap.js
      - name: Run policy tests
        run: node test/test.js
      - name: Build XPI
        shell: pwsh
        run: ./scripts/build.ps1
